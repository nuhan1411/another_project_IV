<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <filter id="ch2shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0b132b" rx="10" />
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#1c2541" />
  <text x="25" y="32" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#48cae4">Challenge 2: HR Analytics &amp; Workforce Retention Matrix</text>
  <text x="1175" y="32" font-family="Segoe UI, sans-serif" font-size="13" fill="#888ea8" text-anchor="end">Refined 4x4 Balanced Analytics Matrix</text>

  <!-- 4 Columns Grid -->
  <!-- COL 1 -->
  <!-- 1. Donut: Gender -->
  <g transform="translate(30, 65)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Current Staff by Gender</text>
    <circle cx="65" cy="80" r="35" fill="none" stroke="#48cae4" stroke-width="14" stroke-dasharray="140 220" />
    <circle cx="65" cy="80" r="35" fill="none" stroke="#e056fd" stroke-width="14" stroke-dasharray="80 220" stroke-dashoffset="-140" />
    <text x="135" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#48cae4">■ Male (62%)</text>
    <text x="135" y="95" font-family="Segoe UI, sans-serif" font-size="11" fill="#e056fd">■ Female (38%)</text>
  </g>
  <!-- 2. Card: Terminated -->
  <g transform="translate(30, 215)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#e7515a" stroke-width="1" />
    <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" fill="#888ea8">TERMINATED EMPLOYEES</text>
    <text x="12" y="75" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#e7515a">237</text>
    <text x="12" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#888ea8">Departed Headcount</text>
  </g>
  <!-- 3. Bar: Education -->
  <g transform="translate(30, 365)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Employees by Education</text>
    <text x="12" y="50" font-family="Segoe UI, sans-serif" font-size="10" fill="#888ea8">Bachelors</text>
    <rect x="12" y="56" width="180" height="10" rx="2" fill="#48cae4" />
    <text x="12" y="85" font-family="Segoe UI, sans-serif" font-size="10" fill="#888ea8">Masters</text>
    <rect x="12" y="91" width="120" height="10" rx="2" fill="#48cae4" />
  </g>
  <!-- 4. Card: Termination Rate -->
  <g transform="translate(30, 515)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#e2a03f" stroke-width="1" />
    <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" fill="#888ea8">TERMINATION RATE</text>
    <text x="12" y="75" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#e2a03f">16.1%</text>
    <text x="12" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#888ea8">Overall Turnover Ratio</text>
  </g>

  <!-- COL 2 -->
  <!-- 1. Card: Total Employees -->
  <g transform="translate(320, 65)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#48cae4" stroke-width="1" />
    <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" fill="#888ea8">TOTAL EMPLOYEES</text>
    <text x="12" y="75" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#48cae4">1,470</text>
    <text x="12" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#888ea8">Total Registered Headcount</text>
  </g>
  <!-- 2. Line: New Hires -->
  <g transform="translate(320, 215)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Quarterly New Hires</text>
    <polyline points="20,100 80,60 140,85 200,45 240,65" fill="none" stroke="#48cae4" stroke-width="2.5" />
  </g>
  <!-- 3. Card: Total Salary -->
  <g transform="translate(320, 365)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#00b4d8" stroke-width="1" />
    <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" fill="#888ea8">TOTAL SALARY PAID</text>
    <text x="12" y="75" font-family="Segoe UI, sans-serif" font-size="30" font-weight="bold" fill="#00b4d8">$9.55M</text>
    <text x="12" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#888ea8">Cumulative Payroll Invested</text>
  </g>
  <!-- 4. Line: Salary Trend -->
  <g transform="translate(320, 515)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Monthly Salary Trend</text>
    <polyline points="20,105 70,80 120,90 170,55 220,70 245,45" fill="none" stroke="#00b4d8" stroke-width="2.5" />
  </g>

  <!-- COL 3 -->
  <!-- 1. Col: WorkLife Balance -->
  <g transform="translate(610, 65)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Work-Life Balance</text>
    <rect x="30" y="55" width="28" height="55" rx="2" fill="#48cae4" />
    <rect x="80" y="40" width="28" height="70" rx="2" fill="#48cae4" />
    <rect x="130" y="30" width="28" height="80" rx="2" fill="#0077b6" />
    <rect x="180" y="65" width="28" height="45" rx="2" fill="#0077b6" />
  </g>
  <!-- 2. Card: Current Employees -->
  <g transform="translate(610, 215)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#06d6a0" stroke-width="1" />
    <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" fill="#888ea8">CURRENT EMPLOYEES</text>
    <text x="12" y="75" font-family="Segoe UI, sans-serif" font-size="32" font-weight="bold" fill="#06d6a0">1,233</text>
    <text x="12" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#888ea8">Retained Active Staff</text>
  </g>
  <!-- 3. Line: Quarterly Terminations -->
  <g transform="translate(610, 365)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Quarterly Terminations</text>
    <polyline points="20,70 80,95 140,55 200,80 240,40" fill="none" stroke="#e7515a" stroke-width="2.5" />
  </g>
  <!-- 4. Col: Job Satisfaction -->
  <g transform="translate(610, 515)" filter="url(#ch2shadow)">
    <rect width="265" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Job Satisfaction Tiers</text>
    <rect x="30" y="70" width="28" height="40" rx="2" fill="#48cae4" />
    <rect x="80" y="55" width="28" height="55" rx="2" fill="#48cae4" />
    <rect x="130" y="35" width="28" height="75" rx="2" fill="#0077b6" />
    <rect x="180" y="45" width="28" height="65" rx="2" fill="#0077b6" />
  </g>

  <!-- COL 4 -->
  <!-- 2. Col: Salary by Tenure -->
  <g transform="translate(900, 215)" filter="url(#ch2shadow)">
    <rect width="270" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Salary Spread by Tenure</text>
    <rect x="25" y="65" width="18" height="45" rx="2" fill="#48cae4" />
    <rect x="47" y="50" width="18" height="60" rx="2" fill="#0077b6" />
    <rect x="95" y="45" width="18" height="65" rx="2" fill="#48cae4" />
    <rect x="117" y="35" width="18" height="75" rx="2" fill="#0077b6" />
    <rect x="165" y="30" width="18" height="80" rx="2" fill="#48cae4" />
    <rect x="187" y="20" width="18" height="90" rx="2" fill="#0077b6" />
  </g>
  <!-- 3. Col: Salary by Working Years -->
  <g transform="translate(900, 365)" filter="url(#ch2shadow)">
    <rect width="270" height="135" rx="6" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
    <text x="12" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Salary Spread by Career Years</text>
    <rect x="25" y="70" width="18" height="40" rx="2" fill="#48cae4" />
    <rect x="47" y="60" width="18" height="50" rx="2" fill="#e056fd" />
    <rect x="95" y="50" width="18" height="60" rx="2" fill="#48cae4" />
    <rect x="117" y="40" width="18" height="70" rx="2" fill="#e056fd" />
    <rect x="165" y="35" width="18" height="75" rx="2" fill="#48cae4" />
    <rect x="187" y="25" width="18" height="85" rx="2" fill="#e056fd" />
  </g>
</svg>